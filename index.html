html{

}

}

header{

    backdrop-filter:blur(10px);
}

nav a{

}

nav a:hover{
    color:#00d4ff;
}

.menu{
    display:none;

    cursor:pointer;
}

    radial-gradient(circle at top,#15243d 0%,#080b14 55%);
}

.hero-content{
    max-width:900px;
}

.badge{

.hero p{

.buttons{
    display:flex;

    gap:15px;
    flex-wrap:wrap;

.btn{

    text-decoration:none;
    font-weight:bold;
    display:inline-block;
}

.primary{
    background:#00d4ff;
    color:#061018;

.secondary{

}

.section-title{

.section-title h2{

}

.section-title p{
    color:#9da5b5;
}

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card{
    background:#101522;
    border:1px solid #20283a;
    border-radius:18px;
    padding:30px 20px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
    border-color:#00d4ff;
}

.icon{
    font-size:42px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#8f98aa;
    font-size:14px;
}

.trending{
    background:#0d111d;
}
