<script>
function playMovie(title, videoId) {

  const player = document.getElementById("youtubePlayer");
  const message = document.getElementById("playerMessage");

  document.getElementById("movieTitle").textContent = title;

  document.getElementById("moviePlayer").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

  if (!videoId) {
    player.src = "";
    player.style.display = "none";
    message.style.display = "block";

    message.textContent =
      "Is movie ki YouTube video abhi add nahi ki gayi. Baad mein iska official video link add kiya ja sakta hai.";

    return;
  }

  message.style.display = "none";
  player.style.display = "block";

  player.src =
    "https://www.youtube.com/embed/" +
    encodeURIComponent(videoId);
}
</script>
