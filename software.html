<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Software - MediaHub</title>
<meta name="description" content="MediaHub Software - Discover useful PC software, utilities, tools and applications.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#070b14;
    color:#fff;
}

header{
    background:#0d1322;
    border-bottom:1px solid #202a40;
    padding:16px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#00d9ff;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:#ddd;
    text-decoration:none;
}

nav a:hover{
    color:#00d9ff;
}

.menu{
    display:none;
    font-size:25px;
}

.hero{
    text-align:center;
    padding:65px 5%;
    background:linear-gradient(135deg,#0b1222,#101b35);
}

.hero h1{
    font-size:42px;
    margin-bottom:12px;
}

.hero h1 span{
    color:#00d9ff;
}

.hero p{
    color:#aeb8ca;
    max-width:650px;
    margin:auto;
}

.search{
    display:flex;
    max-width:600px;
    margin:25px auto 0;
    gap:8px;
}

.search input{
    flex:1;
    padding:14px;
    border:0;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

.search button{
    padding:14px 22px;
    border:0;
    border-radius:8px;
    background:#00d9ff;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:90%;
    max-width:1200px;
    margin:40px auto;
}

.title{
    font-size:28px;
    margin-bottom:22px;
}

.title span{
    color:#00d9ff;
}

.software-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:#0e1627;
    border:1px solid #202c43;
    border-radius:14px;
    padding:25px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#00d9ff;
}

.icon{
    font-size:48px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#aab4c5;
    font-size:14px;
    margin-bottom:15px;
}

.tags{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.tag{
    background:#17243a;
    color:#00d9ff;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
}

.btn{
    display:inline-block;
    padding:9px 15px;
    background:#00d9ff;
    color:#001018;
    text-decoration:none;
    border-radius:7px;
    font-weight:bold;
    font-size:13px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:45px;
}

.category{
    background:#0e1627;
    border:1px solid #202c43;
    padding:23px 12px;
    border-radius:12px;
    text-align:center;
    cursor:pointer;
}

.category:hover{
    border-color:#00d9ff;
}

.category div{
    font-size:32px;
    margin-bottom:8px;
}

.updates{
    margin-top:50px;
}

.update{
    background:#0e1627;
    border:1px solid #202c43;
    border-radius:10px;
    padding:18px;
    margin-bottom:12px;
}

.update strong{
    color:#
